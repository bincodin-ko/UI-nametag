<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>UiNametag 시안 C 트레이 팝업</title>
<style>
/* shadcn tokens.css — 그대로 붙임 */
:root {
  --bg: #ffffff; --surface: #ffffff; --surface-warm: var(--surface);
  --fg: #111827; --fg-2: var(--fg); --muted: #64748b; --meta: var(--muted);
  --border: #e5e7eb; --border-soft: var(--border);
  --accent: #000000; --accent-on: #ffffff;
  --accent-hover: color-mix(in oklab, var(--accent), white 10%);
  --accent-active: color-mix(in oklab, var(--accent), white 18%);
  --success: #16a34a; --warn: #d97706; --danger: #dc2626;
  --font-display: "Geist", "Geist Sans", -apple-system, system-ui, "Segoe UI", Arial, sans-serif;
  --font-body: "Geist", "Geist Sans", -apple-system, system-ui, "Segoe UI", Arial, sans-serif;
  --font-mono: "Fira Code", ui-monospace, "SF Mono", "JetBrains Mono", Menlo, Monaco, Consolas, monospace;
  --text-xs: 12px; --text-sm: 14px; --text-base: 16px; --text-lg: 20px; --text-xl: 24px; --text-2xl: 32px; --text-3xl: 40px; --text-4xl: 48px;
  --leading-body: 1.5; --leading-tight: 1.2; --tracking-display: -0.02em;
  --space-1: 4px; --space-2: 8px; --space-3: 12px; --space-4: 16px; --space-5: 20px; --space-6: 24px; --space-8: 32px; --space-12: 48px;
  --section-y-desktop: 96px; --section-y-tablet: 64px; --section-y-phone: 48px;
  --radius-sm: 6px; --radius-md: 8px; --radius-lg: 12px; --radius-pill: 9999px;
  --elev-flat: none; --elev-ring: 0 0 0 1px var(--border);
  --elev-raised: 0 1px 2px 0 color-mix(in oklab, var(--fg), transparent 92%), 0 1px 3px 0 color-mix(in oklab, var(--fg), transparent 88%);
  --focus-ring: 0 0 0 2px var(--bg), 0 0 0 4px var(--accent);
  --motion-fast: 150ms; --motion-base: 200ms; --ease-standard: cubic-bezier(0.2, 0, 0, 1);
  --container-max: 1280px; --container-gutter-desktop: 24px; --container-gutter-tablet: 16px; --container-gutter-phone: 16px;
}
/* 제품 고유 값(brief.md): 브랜드 주황·녹화 빨강, 데스크톱 배경 */
:root {
  --brand: #ff6a00; --rec: #e5534b;
  --wp-a: #cfd8d3; --wp-b: #e9d9c4; --wp-c: #b9c7d6; --wp-d: #f3e6d6; --wp-win: #8794a3;
  --muted-bg: color-mix(in oklab, var(--fg), transparent 95%);
  --shadow-pop: 0 1px 3px color-mix(in oklab, var(--fg), transparent 80%), 0 16px 40px color-mix(in oklab, var(--fg), transparent 78%);
}
*, *::before, *::after { box-sizing: border-box; }
html, body { margin: 0; padding: 0; }
body { background: var(--fg); color: var(--fg); font-family: var(--font-body); font-size: var(--text-sm); line-height: var(--leading-body); -webkit-font-smoothing: antialiased; }
button, input, select { font: inherit; color: inherit; }
button { cursor: pointer; }
:focus-visible { outline: none; box-shadow: var(--focus-ring); }
svg.i { width: 16px; height: 16px; fill: none; stroke: currentColor; stroke-width: 1.75; stroke-linecap: round; stroke-linejoin: round; flex: none; }
.mono { font-family: var(--font-mono); font-size: var(--text-xs); }
.muted { color: var(--muted); }
kbd { font-family: var(--font-mono); font-size: var(--text-xs); border: 1px solid var(--border); border-bottom-width: 2px; border-radius: var(--radius-sm); padding: 0 6px; background: var(--bg); }

/* ───── 무대 1100×700 ───── */
.stage { position: relative; width: 1100px; height: 700px; overflow: hidden;
  background:
    radial-gradient(520px 380px at 18% 22%, var(--wp-d), transparent 70%),
    radial-gradient(640px 460px at 78% 18%, var(--wp-c), transparent 70%),
    radial-gradient(600px 420px at 40% 95%, var(--wp-b), transparent 70%),
    var(--wp-a); }
.ghost-win { position: absolute; background: color-mix(in oklab, var(--bg), var(--wp-win) 40%); border-radius: var(--radius-lg); filter: blur(7px); opacity: .75; }
.ghost-win.a { left: 70px; top: 120px; width: 440px; height: 300px; }
.ghost-win.b { left: 250px; top: 300px; width: 380px; height: 260px; opacity: .55; }
.ghost-win::before { content: ""; position: absolute; inset: 0 0 auto 0; height: 28px; background: color-mix(in oklab, var(--fg), transparent 85%); border-radius: var(--radius-lg) var(--radius-lg) 0 0; }

/* 상태 미리보기 */
.preview { position: absolute; left: 12px; top: 10px; z-index: 30; display: flex; align-items: center; gap: var(--space-2); padding: 4px 4px 4px 12px; background: color-mix(in oklab, var(--bg), transparent 8%); border: 1px solid var(--border); border-radius: var(--radius-pill); box-shadow: var(--elev-raised); }
.preview > span { font-size: var(--text-xs); color: var(--muted); white-space: nowrap; }
.preview button { border: 0; background: transparent; padding: 4px 12px; border-radius: var(--radius-pill); font-size: var(--text-xs); font-weight: 500; color: var(--muted); }
.preview button[aria-pressed="true"] { background: var(--accent); color: var(--accent-on); }
.preview button:not([aria-pressed="true"]):hover { background: var(--muted-bg); color: var(--fg); }

/* 작업 표시줄 */
.taskbar { position: absolute; left: 0; right: 0; bottom: 0; height: 44px; z-index: 10; background: color-mix(in oklab, var(--bg), transparent 14%); backdrop-filter: blur(20px); border-top: 1px solid color-mix(in oklab, var(--fg), transparent 90%); display: flex; align-items: center; justify-content: center; }
.tb-apps { display: flex; gap: 6px; }
.tb-apps i { width: 28px; height: 28px; border-radius: var(--radius-sm); background: color-mix(in oklab, var(--fg), transparent 88%); display: block; }
.tb-apps i:first-child { background: var(--accent); border-radius: 4px; width: 22px; height: 22px; margin: 3px; }
.tray { position: absolute; right: 8px; top: 0; bottom: 0; display: flex; align-items: center; gap: 2px; color: var(--fg); font-size: var(--text-xs); }
.tray > * { height: 34px; padding: 0 8px; display: flex; align-items: center; border-radius: var(--radius-sm); border: 0; background: transparent; }
.tray button:hover, .tray .clock:hover { background: var(--muted-bg); }
.tray button[aria-expanded="true"] { background: color-mix(in oklab, var(--fg), transparent 88%); }
.tray .clock { flex-direction: column; justify-content: center; align-items: flex-end; line-height: 1.25; }
.tag-ico { width: 22px; height: 22px; border-radius: 6px; background: var(--brand); color: var(--bg); display: grid; place-items: center; }
.tag-ico svg.i { width: 14px; height: 14px; }

/* ───── 팝업 380px ───── */
.pop { position: absolute; right: 12px; bottom: 56px; top: 54px; width: 380px; z-index: 20; display: flex; flex-direction: column; background: color-mix(in oklab, var(--bg), transparent 4%); backdrop-filter: blur(24px); border: 1px solid var(--border); border-radius: var(--radius-lg); box-shadow: var(--shadow-pop); transition: opacity var(--motion-base) var(--ease-standard), transform var(--motion-base) var(--ease-standard); }
.pop[hidden], .wide[hidden] { display: flex; visibility: hidden; opacity: 0; transform: translateY(12px); pointer-events: none; }
.pop-head { display: flex; align-items: center; gap: var(--space-3); padding: var(--space-4) var(--space-4) var(--space-3); }
.logo { width: 36px; height: 36px; border-radius: var(--radius-md); background: var(--brand); color: var(--bg); display: grid; place-items: center; }
.logo svg.i { width: 20px; height: 20px; }
.pop-head h1 { margin: 0; font-family: var(--font-display); font-size: var(--text-base); font-weight: 600; letter-spacing: var(--tracking-display); line-height: 1.2; }
.pop-head p { margin: 2px 0 0; font-size: var(--text-xs); color: var(--muted); display: flex; align-items: center; gap: 6px; }
.dot { width: 8px; height: 8px; border-radius: 50%; background: var(--muted); display: inline-block; flex: none; }
.dot.ok { background: var(--success); } .dot.warn { background: var(--warn); } .dot.bad { background: var(--danger); }
.pop-body { flex: 1; min-height: 0; overflow-y: auto; padding: 0 var(--space-4) var(--space-3); display: flex; flex-direction: column; gap: var(--space-3); scrollbar-width: thin; }
.pop-foot { padding: var(--space-3) var(--space-4); border-top: 1px solid var(--border); display: flex; gap: var(--space-2); }

/* 큰 토글 3개 */
.tiles { display: grid; grid-template-columns: repeat(3, 1fr); gap: var(--space-2); padding: 0 var(--space-4); }
.tile { text-align: left; display: flex; flex-direction: column; gap: 2px; padding: var(--space-3); min-height: 84px; border: 1px solid var(--border); border-radius: var(--radius-lg); background: var(--surface); box-shadow: var(--elev-raised); transition: background var(--motion-fast), color var(--motion-fast), transform var(--motion-fast); }
.tile:hover { background: var(--muted-bg); }
.tile:active { transform: translateY(1px); }
.tile svg.i { width: 20px; height: 20px; margin-bottom: 6px; }
.tile b { font-size: var(--text-sm); font-weight: 600; line-height: 1.2; }
.tile small { font-size: var(--text-xs); color: var(--muted); line-height: 1.3; }
.tile[aria-pressed="true"] { background: var(--accent); color: var(--accent-on); border-color: var(--accent); }
.tile[aria-pressed="true"]:hover { background: var(--accent-hover); }
.tile[aria-pressed="true"] small { color: color-mix(in oklab, var(--accent-on), transparent 25%); }
.tile.rec[aria-pressed="true"] { background: var(--rec); border-color: var(--rec); }
.tile.rec[aria-pressed="true"]:hover { background: color-mix(in oklab, var(--rec), white 8%); }
.tile:disabled { opacity: .45; cursor: not-allowed; }
.queue-line { margin: 0 var(--space-4); display: flex; align-items: center; gap: var(--space-2); font-size: var(--text-xs); color: var(--muted); }
.queue-line b { color: var(--fg); font-size: var(--text-sm); }
.badge-n { min-width: 22px; height: 22px; padding: 0 6px; border-radius: var(--radius-pill); background: var(--brand); color: var(--bg); font-size: var(--text-xs); font-weight: 600; display: inline-grid; place-items: center; }
.badge-n.zero { background: var(--muted-bg); color: var(--muted); }
.link { border: 0; background: none; padding: 2px 4px; margin-left: auto; font-size: var(--text-xs); color: var(--fg); text-decoration: underline; text-underline-offset: 3px; border-radius: var(--radius-sm); }

/* 버튼 */
.btn { display: inline-flex; align-items: center; justify-content: center; gap: 6px; height: 36px; padding: 0 var(--space-3); border-radius: var(--radius-sm); border: 1px solid var(--border); background: var(--surface); font-size: var(--text-sm); font-weight: 500; white-space: nowrap; transition: background var(--motion-fast); }
.btn:hover { background: var(--muted-bg); }
.btn.pri { background: var(--accent); color: var(--accent-on); border-color: var(--accent); }
.btn.pri:hover { background: var(--accent-hover); } .btn.pri:active { background: var(--accent-active); }
.btn.sm { height: 28px; padding: 0 10px; font-size: var(--text-xs); }
.btn.danger { color: var(--danger); }
.btn.grow { flex: 1; }
.btn:disabled { opacity: .45; cursor: not-allowed; }
.btn.ghost { border-color: transparent; background: transparent; }
.btn.ghost:hover { background: var(--muted-bg); }

/* 카드 */
.card { border: 1px solid var(--border); border-radius: var(--radius-lg); background: var(--surface); padding: var(--space-3) var(--space-4); }
.eyebrow { font-size: var(--text-xs); color: var(--muted); margin: 0 0 6px; font-weight: 500; }
.hover-card .name { display: flex; align-items: center; gap: var(--space-2); font-size: var(--text-lg); font-weight: 600; letter-spacing: var(--tracking-display); line-height: 1.2; }
.hover-card .meta { margin: 4px 0 var(--space-3); font-size: var(--text-xs); color: var(--muted); overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
.hover-card .row { display: flex; gap: var(--space-2); align-items: center; }
.chip { display: inline-flex; align-items: center; gap: 6px; height: 22px; padding: 0 8px; border-radius: var(--radius-pill); border: 1px solid var(--border); font-size: var(--text-xs); font-weight: 500; white-space: nowrap; background: var(--surface); }
.chip.ok { color: var(--success); } .chip.warn { color: var(--warn); } .chip.bad { color: var(--danger); }
.chip .dot { width: 6px; height: 6px; background: currentColor; }

/* 앱 목록 아코디언 */
.list-head { display: flex; align-items: center; justify-content: space-between; margin-top: 2px; }
.list-head h2 { margin: 0; font-size: var(--text-sm); font-weight: 600; display: flex; gap: 8px; align-items: center; }
.apps { border: 1px solid var(--border); border-radius: var(--radius-lg); background: var(--surface); overflow: hidden; flex: none; }
.app + .app { border-top: 1px solid var(--border); }
.app-btn { width: 100%; display: flex; align-items: center; gap: var(--space-3); padding: 10px var(--space-3); border: 0; background: transparent; text-align: left; min-height: 48px; }
.app-btn:hover { background: var(--muted-bg); }
.app-btn:focus-visible { box-shadow: inset 0 0 0 2px var(--accent); }
.app-ico { width: 28px; height: 28px; border-radius: var(--radius-sm); background: var(--muted-bg); display: grid; place-items: center; flex: none; }
.app-t { flex: 1; min-width: 0; }
.app-t b { display: block; font-size: var(--text-sm); font-weight: 600; line-height: 1.25; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
.app-t span { font-size: var(--text-xs); color: var(--muted); }
.chev { transition: transform var(--motion-fast) var(--ease-standard); color: var(--muted); }
.app-btn[aria-expanded="true"] .chev { transform: rotate(180deg); }
.app-panel { padding: 0 var(--space-3) var(--space-3) calc(var(--space-3) + 28px + var(--space-3)); }
.app-panel[hidden] { display: none; }
.kv { display: grid; grid-template-columns: 64px 1fr; gap: 4px var(--space-2); margin: 0 0 var(--space-3); font-size: var(--text-xs); }
.kv dt { color: var(--muted); } .kv dd { margin: 0; word-break: break-all; }
.acts { display: flex; gap: 6px; flex-wrap: wrap; }
.note { margin: 0 0 var(--space-3); padding: var(--space-2) var(--space-3); border-radius: var(--radius-sm); font-size: var(--text-xs); background: var(--muted-bg); }
.note.bad { background: color-mix(in oklab, var(--danger), transparent 92%); }
.note.warn { background: color-mix(in oklab, var(--warn), transparent 90%); }
.note b { display: block; margin-bottom: 2px; }
.bar { height: 6px; border-radius: var(--radius-pill); background: var(--muted-bg); overflow: hidden; margin: 2px 0 var(--space-2); }
.bar > i { display: block; height: 100%; background-color: var(--accent); border-radius: inherit; transition: width var(--motion-base) linear; }
.empty { text-align: center; padding: var(--space-3) var(--space-4); }
.empty h3 { margin: 0 0 4px; font-size: var(--text-base); font-weight: 600; letter-spacing: var(--tracking-display); }
.empty p { margin: 0 0 var(--space-2); color: var(--muted); font-size: var(--text-xs); }
.empty .em-ico { width: 44px; height: 44px; margin: 0 auto; border-radius: var(--radius-lg); border: 1px dashed var(--border); display: grid; place-items: center; color: var(--muted); }
.confirm { display: flex; align-items: center; gap: var(--space-2); font-size: var(--text-xs); flex-wrap: wrap; }

/* 등록 마법사 */
.wiz-head { display: flex; align-items: center; gap: var(--space-2); padding: var(--space-3) var(--space-3) var(--space-2) var(--space-3); }
.wiz-head h2 { margin: 0; font-size: var(--text-base); font-weight: 600; letter-spacing: var(--tracking-display); flex: 1; }
.steps { display: flex; gap: 6px; padding: 0 var(--space-4) var(--space-3); margin: 0; }
.steps li { list-style: none; flex: 1; font-size: var(--text-xs); color: var(--muted); }
.steps li::before { content: ""; display: block; height: 4px; border-radius: 2px; background: var(--border); margin-bottom: 6px; }
.steps li.on { color: var(--fg); font-weight: 600; } .steps li.on::before, .steps li.done::before { background: var(--accent); }
.pick { display: flex; align-items: center; gap: var(--space-3); width: 100%; text-align: left; padding: 10px var(--space-3); border: 1px solid var(--border); border-radius: var(--radius-md); background: var(--surface); }
.pick:hover { background: var(--muted-bg); }
.pick[aria-checked="true"] { border-color: var(--accent); box-shadow: 0 0 0 1px var(--accent); }
.pick .t { flex: 1; min-width: 0; } .pick .t b { display: block; font-size: var(--text-sm); font-weight: 600; } .pick .t span { font-size: var(--text-xs); color: var(--muted); display: block; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
.radio { width: 16px; height: 16px; border-radius: 50%; border: 1px solid var(--muted); flex: none; display: grid; place-items: center; }
[aria-checked="true"] > .radio { border-color: var(--accent); } [aria-checked="true"] > .radio::after { content: ""; width: 8px; height: 8px; border-radius: 50%; background: var(--accent); }
.big-pick { height: 56px; width: 100%; font-size: var(--text-base); font-weight: 600; gap: var(--space-2); flex: none; }
.sep { display: flex; align-items: center; gap: var(--space-2); font-size: var(--text-xs); color: var(--muted); margin: 2px 0; }
.sep::before, .sep::after { content: ""; flex: 1; height: 1px; background: var(--border); }
.field { display: flex; flex-direction: column; gap: 6px; }
.field label { font-size: var(--text-xs); font-weight: 500; }
.input { height: 36px; padding: 0 var(--space-3); border: 1px solid var(--border); border-radius: var(--radius-sm); background: var(--surface); width: 100%; font-size: var(--text-sm); }
.input.mono { font-size: var(--text-xs); }
.code-list { margin: 0; padding: var(--space-2) var(--space-3); list-style: none; background: var(--muted-bg); border-radius: var(--radius-md); display: grid; gap: 4px; }
.code-list li { display: flex; gap: 6px; align-items: baseline; font-family: var(--font-mono); font-size: var(--text-xs); }
.code-list .arr { color: var(--muted); }
.code-list .f { color: var(--muted); margin-left: auto; text-align: right; }
.big-num { display: flex; align-items: baseline; gap: 6px; font-size: var(--text-sm); color: var(--muted); }
.big-num b { font-size: var(--text-2xl); font-weight: 700; color: var(--fg); letter-spacing: var(--tracking-display); line-height: 1; }

/* ───── 넓은 패널 (옆으로 펼침) ───── */
.wide { position: absolute; right: 400px; top: 54px; bottom: 56px; width: 640px; z-index: 19; display: flex; flex-direction: column; background: color-mix(in oklab, var(--bg), transparent 4%); backdrop-filter: blur(24px); border: 1px solid var(--border); border-radius: var(--radius-lg); box-shadow: var(--shadow-pop); transition: opacity var(--motion-base) var(--ease-standard), transform var(--motion-base) var(--ease-standard); }
.wide[hidden] { transform: translateX(32px); }
.wide-head { display: flex; align-items: center; gap: var(--space-3); padding: var(--space-3) var(--space-4); border-bottom: 1px solid var(--border); }
.tabs { display: inline-flex; padding: 3px; background: var(--muted-bg); border-radius: var(--radius-md); gap: 2px; }
.tabs button { border: 0; background: transparent; height: 30px; padding: 0 var(--space-4); border-radius: var(--radius-sm); font-weight: 500; color: var(--muted); display: inline-flex; align-items: center; gap: 6px; }
.tabs button[aria-selected="true"] { background: var(--bg); color: var(--fg); box-shadow: var(--elev-raised); }
.wide-head .btn { margin-left: auto; }
.wide-body { flex: 1; min-height: 0; overflow-y: auto; padding: var(--space-4); display: flex; flex-direction: column; gap: var(--space-5); scrollbar-width: thin; }
.sec-h { display: flex; align-items: center; justify-content: space-between; margin: 0 0 var(--space-2); }
.sec-h h3 { margin: 0; font-size: var(--text-sm); font-weight: 600; }
table { width: 100%; border-collapse: collapse; font-size: var(--text-xs); }
.tbl { border: 1px solid var(--border); border-radius: var(--radius-lg); overflow: hidden; background: var(--surface); }
th { text-align: left; font-weight: 500; color: var(--muted); padding: 8px 10px; background: var(--muted-bg); white-space: nowrap; }
td { padding: 10px; border-top: 1px solid var(--border); vertical-align: top; }
td.num { color: var(--muted); font-family: var(--font-mono); }
td .sub { display: block; color: var(--muted); }
td .where { font-family: var(--font-mono); word-break: break-all; }
.set { border: 1px solid var(--border); border-radius: var(--radius-lg); background: var(--surface); }
.set-row { display: flex; align-items: center; gap: var(--space-4); padding: var(--space-3) var(--space-4); }
.set-row + .set-row { border-top: 1px solid var(--border); }
.set-row .l { flex: 1; min-width: 0; } .set-row .l b { display: block; font-weight: 600; font-size: var(--text-sm); } .set-row .l span { font-size: var(--text-xs); color: var(--muted); }
.sw { position: relative; width: 40px; height: 22px; border-radius: var(--radius-pill); border: 0; background: var(--border); padding: 0; flex: none; transition: background var(--motion-fast); }
.sw::after { content: ""; position: absolute; top: 2px; left: 2px; width: 18px; height: 18px; border-radius: 50%; background: var(--bg); box-shadow: var(--elev-raised); transition: transform var(--motion-fast) var(--ease-standard); }
.sw[aria-checked="true"] { background: var(--accent); } .sw[aria-checked="true"]::after { transform: translateX(18px); }
select.input { width: auto; min-width: 130px; }
.cmd { display: flex; gap: var(--space-2); }

.recs { display: grid; gap: var(--space-2); }

    foot = !run ? `<button class="btn grow" data-act="back">${ic('back')}이전</button><button class="btn pri grow" data-act="build">사전 만들기</button>`
      : loading ? `<button class="btn grow" disabled>만드는 중…</button>`
      : err ? `<button class="btn grow" data-act="back">${ic('back')}폴더 다시 고르기</button><button class="btn grow" data-act="wizCancel">나중에</button>`
      : `<button class="btn pri grow" data-act="finish">${ic('check')}등록 끝내기</button>`;
  }
  return `<div class="wiz-head"><button class="btn sm ghost" data-act="wizCancel" aria-label="등록 닫기">${ic('x')}</button><h2>새 앱 등록</h2><span class="muted" style="font-size:12px;padding-right:8px">${w.step} / 3</span></div>${steps}
  <div class="pop-body" data-od-id="wizard">${body}</div><div class="pop-foot">${foot}</div>`;
}

/* ───── 넓은 패널 ───── */
function renderWide(){
  const w = $('#wide'); w.hidden = !(S.wide && S.popup);
  const tabBtn = (id,l,n) => `<button role="tab" id="tab-${id}" aria-selected="${S.tab===id}" aria-controls="tabpanel" tabindex="${S.tab===id?0:-1}" data-act="tab" data-tab="${id}">${l}${n!=null?` <span class="badge-n ${n?'':'zero'}">${n}</span>`:''}</button>`;
  w.innerHTML = `<div class="wide-head"><div class="tabs" role="tablist" aria-label="전체 창 메뉴">${tabBtn('queue','대기열',total())}${tabBtn('settings','설정')}</div>
    <button class="btn sm ghost" data-act="toggleWide" aria-label="전체 창 닫기">${ic('x')}닫기</button></div>
    <div class="wide-body" id="tabpanel" role="tabpanel" aria-labelledby="tab-${S.tab}">${S.tab==='queue'?queueTab():settingsTab()}</div>`;
}
function queueTab(){
  const p = qPicks(), r = qRecs();
  if (!p.length && !r.length) return `<div class="card empty" style="margin:auto 0"><div class="em-ico">${ic('cross')}</div><h3>대기열이 비었어요</h3><p>Ctrl+Shift+G로 화면의 부품을 고르거나<br>Ctrl+Shift+R로 동작을 녹화하면 여기에 쌓여요.</p></div>`;
  return `<section><div class="sec-h"><h3>고른 것 ${p.length}개</h3><button class="btn sm" data-act="clearAll">모두 지우기</button></div>
    <div class="tbl"><table><thead><tr><th>#</th><th>앱 · 부품</th><th>위치</th><th>메모</th><th>동작</th><th></th></tr></thead><tbody>
    ${p.map(x=>`<tr><td class="num">${x.n}</td><td><b>${esc(x.app)}</b><span class="sub">${esc(x.part)}</span></td><td class="where">${esc(x.where)}</td><td>${esc(x.memo)}</td><td>${x.act}<span class="sub">${x.got?'가져감':'대기 중'}</span></td><td><button class="btn sm ghost" data-act="delPick" data-n="${x.n}" aria-label="#${x.n} 지우기">${ic('trash')}</button></td></tr>`).join('')}</tbody></table></div></section>
    <section><div class="sec-h"><h3>녹화 ${r.length}개</h3></div><div class="recs">
    ${r.map(x=>`<div class="rec-row"><span class="rd"></span><span class="t"><b>${x.id}</b> · ${x.sec}<br><span class="muted">${esc(x.memo)}</span></span><span class="chip">${x.got?'가져감':'대기 중'}</span><button class="btn sm ghost" data-act="delRec" data-id="${x.id}" aria-label="${x.id} 지우기">${ic('trash')}</button></div>`).join('') || '<p class="muted" style="margin:0">녹화가 없어요.</p>'}</div></section>`;
}
function settingsTab(){
  const sw = (k,l) => `<button class="sw" role="switch" aria-checked="${S.set[k]}" aria-label="${l}" data-act="sw" data-k="${k}"></button>`;
  return `<section><div class="sec-h"><h3>단축키</h3></div><div class="set">
      <div class="set-row"><div class="l"><b>고르기</b><span>화면의 부품을 가리켜 고름</span></div><kbd>Ctrl+Shift+G</kbd><button class="btn sm" data-act="toast" data-msg="새 단축키를 눌러 주세요">바꾸기</button></div>
      <div class="set-row"><div class="l"><b>녹화</b><span>시작·멈춤을 한 키로</span></div><kbd>Ctrl+Shift+R</kbd><button class="btn sm" data-act="toast" data-msg="새 단축키를 눌러 주세요">바꾸기</button></div></div></section>
    <section><div class="sec-h"><h3>동작</h3></div><div class="set">
      <div class="set-row"><div class="l"><b>Windows 시작 시 자동 켜기</b><span>PC를 켜면 트레이에 바로 떠요</span></div>${sw('auto','자동 켜기')}</div>
      <div class="set-row"><div class="l"><b>녹화 화질</b></div><select class="input" aria-label="녹화 화질"><option>보통 (720p)</option><option>높음 (1080p)</option></select></div>
      <div class="set-row"><div class="l"><b>녹화 최대 길이</b><span>넘으면 자동으로 멈춰요</span></div><select class="input" aria-label="최대 길이"><option>30초</option><option>1분</option><option>3분</option></select></div></div></section>
    <section><div class="sec-h"><h3>데이터 폴더</h3></div><div class="set"><div class="set-row"><div class="l"><span class="mono" style="color:var(--fg)">C:\\Users\\gusql\\AppData\\Roaming\\UiNametag</span></div><button class="btn sm" data-act="folder">${ic('folder')}열기</button></div></div></section>
    <section><div class="sec-h"><h3>Claude 연결 (MCP)</h3><span class="chip ok"><span class="dot"></span>연결됨</span></div>
      <p class="muted" style="margin:0 0 8px;font-size:12px">Claude Code에 처음 한 번만 붙여 넣으면 대기열을 가져갈 수 있어요.</p>
      <div class="cmd"><code id="cmd">claude mcp add uinametag -- uinametag-mcp</code><button class="btn" data-act="copy">${ic('copy')}복사</button></div></section>`;
}

/* ───── 이벤트 ───── */
function setState(s){
  S.state = s; clearInterval(timer);
  document.querySelectorAll('.preview button').forEach(b=>b.setAttribute('aria-pressed', b.dataset.state===s));
  if (s==='empty') S.hover = 'todo'; else if (S.hover==='todo' && !S.wiz) S.hover = 'iina';
  if (s==='error'||s==='loading') S.open = {iina:true};
  renderAll();
}
function renderAll(){ renderPop(); renderWide(); }
function toast(m){ const t=$('#toast'); t.textContent=m; t.classList.add('show'); clearTimeout(toast.t); toast.t=setTimeout(()=>t.classList.remove('show'),1800); }
function runJob(id){ job[id]=0; const t=setInterval(()=>{ job[id]+=12; if(job[id]>=100){ clearInterval(t); delete job[id]; const a=APPS.find(x=>x.id===id); if(a){a.stale=false; a.at='2026-10-20 16:48';} toast('사전을 다시 만들었어요'); } renderAll(); },260); renderAll(); }

document.addEventListener('click', e => {
  const sb = e.target.closest('.preview button'); if (sb) return setState(sb.dataset.state);
  if (e.target.closest('#trayBtn')) { S.popup=!S.popup; return renderAll(); }
  const el = e.target.closest('[data-act]'); if (!el || el.tagName==='INPUT') return;
  const a = el.dataset.act, id = el.dataset.id;
  switch(a){
    case 'on': S.on=!S.on; if(!S.on){S.pick=false;S.rec=false;} break;
    case 'pick': S.pick=!S.pick; break;
    case 'rec': S.rec=!S.rec; if(!S.rec) toast('녹화를 저장했어요 (대기열)'); break;
    case 'toggleWide': S.wide=!S.wide; break;
    case 'openWide': S.wide=true; S.tab=el.dataset.tab; break;
    case 'tab': S.tab=el.dataset.tab; break;
    case 'acc': S.open[id]=!S.open[id]; break;
    case 'swapHover': S.hover = S.hover==='todo' ? 'iina' : 'todo'; break;
    case 'rebuild': runJob(id); return;
    case 'askDel': S.confirm=id; S.open[id]=true; break;
    case 'cancelDel': S.confirm=null; break;
    case 'del': APPS.splice(APPS.findIndex(x=>x.id===id),1); S.confirm=null; if(S.hover===id) S.hover='todo'; toast('앱을 지웠어요'); break;
    case 'folder': toast('탐색기에서 폴더를 열었어요'); return;
    case 'toast': toast(el.dataset.msg); return;
    case 'copy': try{ navigator.clipboard.writeText($('#cmd').textContent).catch(()=>{}); }catch(_){} toast('명령을 복사했어요'); return;
    case 'sw': S.set[el.dataset.k]=!S.set[el.dataset.k]; break;
    case 'delPick': S.q.picks=S.q.picks.filter(x=>x.n!=el.dataset.n); break;
    case 'delRec': S.q.recs=S.q.recs.filter(x=>x.id!==id); break;
    case 'clearAll': S.q.picks=[]; S.q.recs=[]; break;
    case 'wizStart': S.wiz = el.dataset.pre==='todo' ? {step:2, src:{name:TODO.name, kind:TODO.kind}, folder:'', prog:0} : {step:1, prog:0}; break;
    case 'wizCancel': S.wiz=null; clearInterval(timer); break;
    case 'crosshair': S.wiz.src={name:'IINA', kind:'Electron'}; toast('IINA 창을 골랐어요'); break;
    case 'selWin': { const x=WINS[el.dataset.i]; S.wiz.src={name:x.name,kind:x.kind}; break; }
    case 'next': S.wiz.step++; break;
    case 'back': S.wiz.step = Math.max(1,S.wiz.step-1); S.wiz.started=false; S.wiz.prog=0; clearInterval(timer); break;
    case 'selFold': S.wiz.folder=RECENT[el.dataset.i].p; break;
    case 'browse': S.wiz.folder=S.wiz.folder||RECENT[0].p; break;
    case 'build': S.wiz.started=true; S.wiz.prog=0; timer=setInterval(()=>{ S.wiz.prog=Math.min(100,S.wiz.prog+14); if(S.wiz.prog>=100) clearInterval(timer); renderPop(); },280); break;
    case 'finish': { const w=S.wiz; APPS.push({id:'n'+Date.now(), name:w.src.name, kind:w.src.kind, icon:w.src.kind==='웹사이트'?'globe':'cube', run:w.src.kind==='웹사이트'?w.src.name:'(방금 고른 창)', src:w.folder, n:216, at:'2026-10-20 16:46'}); S.wiz=null; if(S.state==='empty') setState('normal'); toast('앱을 등록했어요'); break; }
  }
  renderAll();
});
document.addEventListener('input', e => {
  const el = e.target.closest('[data-act]'); if(!el || !S.wiz) return;
  const n = () => document.querySelector('.pop-foot [data-act="next"]');
  if (el.dataset.act==='url') { S.wiz.url=el.value; S.wiz.src = el.value ? {name:el.value, kind:'웹사이트'} : null; if(n()) n().disabled=!S.wiz.src; }
  if (el.dataset.act==='fold') { S.wiz.folder=el.value; if(n()) n().disabled=!el.value; }
});
document.addEventListener('keydown', e => {
  if (e.key==='Escape') { if(S.wiz) S.wiz=null; else if(S.wide) S.wide=false; else S.popup=false; renderAll(); }
  const t = e.target.closest && e.target.closest('[role=tab]');
  if (t && (e.key==='ArrowLeft'||e.key==='ArrowRight')) { S.tab = S.tab==='queue'?'settings':'queue'; renderWide(); $('#tab-'+S.tab).focus(); }
});
// 캡처용 주소 끝 #: empty loading error wide settings wiz1 wiz2 wiz3 built rec pick
(function(){ const h=location.hash.slice(1).split(',');
  ['empty','loading','error'].forEach(s=>{ if(h.includes(s)) S.state=s; });
  if(h.includes('wide')) S.wide=true; if(h.includes('settings')){S.wide=true;S.tab='settings';}
  if(h.includes('pick')) S.pick=true; if(h.includes('rec')) S.rec=true;
  if(h.includes('wiz1')) S.wiz={step:1,prog:0};
  if(h.includes('wiz2')) S.wiz={step:2,src:{name:'남은일',kind:'Tauri/웹뷰'},folder:RECENT[0].p,prog:0};
  if(h.includes('wiz3')) S.wiz={step:3,src:{name:'IINA',kind:'Electron'},folder:RECENT[1].p,prog:100,started:h.includes('built')};
  document.querySelectorAll('.preview button').forEach(b=>b.setAttribute('aria-pressed', b.dataset.state===S.state));
  if(S.state==='empty') S.hover='todo'; if(S.state==='error'||S.state==='loading') S.open={iina:true};
  renderAll(); })();
</script>
</body>
</html>
